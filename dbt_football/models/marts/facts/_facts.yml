version: 2

models:
  - name: fact_match
    description: One row per match. See model file header for full grain/key documentation.
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: home_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: away_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

  - name: fact_team_match
    description: One row per team per match. See model file header for full grain/key documentation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['match_id', 'team_id']
    columns:
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: points
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]

  - name: fact_standing_snapshot
    description: One row per (competition_code, season, matchweek, team) - independently-derived standings. See model file header for full grain/key documentation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['competition_code', 'season', 'matchweek', 'team_id']
    columns:
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: league_position
        tests: [not_null]
