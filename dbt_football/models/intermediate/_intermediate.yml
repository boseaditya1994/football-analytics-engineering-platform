version: 2

models:
  - name: int_match_team_performance
    description: One row per team per finished match (home/away unpivoted).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['match_id', 'team_id']
    columns:
      - name: match_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ['WIN', 'DRAW', 'LOSS']
      - name: points
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 3]

  - name: int_table_progression
    description: Independently-derived, running league/group-stage table after each team's each table-eligible match.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['competition_code', 'team_id', 'as_of_match_id']
    columns:
      - name: team_id
        tests: [not_null]
      - name: competition_code
        tests: [not_null]
      - name: league_position
        tests: [not_null]
      - name: points
        tests: [not_null]
