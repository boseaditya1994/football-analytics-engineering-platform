name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,dashboard]"

      - name: Ruff lint
        run: ruff check src tests dashboards/api

      - name: Pytest
        run: pytest -v

  dbt:
    name: dbt compile & parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dbt
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: dbt parse (no live Snowflake connection needed)
        working-directory: dbt_football
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_football
          SNOWFLAKE_ACCOUNT: "dummy_account"
          SNOWFLAKE_USER: "dummy_user"
          SNOWFLAKE_PASSWORD: "dummy_password"
        run: |
          cp profiles.yml.example profiles.yml
          # CI validates project structure/Jinja/YAML only - it never touches
          # a real warehouse, so it uses throwaway password-auth placeholders
          # instead of the real key-pair profile config.
          sed -i "s/authenticator: SNOWFLAKE_JWT/password: \"{{ env_var('SNOWFLAKE_PASSWORD') }}\"/" profiles.yml
          sed -i "/private_key_path/d;/private_key_passphrase/d" profiles.yml
          dbt deps
          dbt parse
